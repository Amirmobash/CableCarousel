name: Firmware checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: 1.3.1
      - name: Compile all firmware alternatives
        run: python3 tools/check_firmware.py --install
      - name: Install Tk for the system Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk
      - name: Install GUI dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/gui-venv"
          "$RUNNER_TEMP/gui-venv/bin/python" -m pip install -r requirements.txt
      - name: Image loading regression tests
        run: '"$RUNNER_TEMP/gui-venv/bin/python" -m unittest discover -s tests -v'
